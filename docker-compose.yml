services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: pos-bakery-api
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend/.env.docker
    environment:
      PORT: 3000
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: npm run dev
